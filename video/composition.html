<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>3D Virtual Office — showcase composition</title>
<style>
  @font-face { font-family: "Sarabun"; font-weight: 400; src: url("../node_modules/@expo-google-fonts/sarabun/400Regular/Sarabun_400Regular.ttf"); }
  @font-face { font-family: "Sarabun"; font-weight: 500; src: url("../node_modules/@expo-google-fonts/sarabun/500Medium/Sarabun_500Medium.ttf"); }
  @font-face { font-family: "Sarabun"; font-weight: 600; src: url("../node_modules/@expo-google-fonts/sarabun/600SemiBold/Sarabun_600SemiBold.ttf"); }
  @font-face { font-family: "Sarabun"; font-weight: 700; src: url("../node_modules/@expo-google-fonts/sarabun/700Bold/Sarabun_700Bold.ttf"); }
  @font-face { font-family: "Sarabun"; font-weight: 800; src: url("../node_modules/@expo-google-fonts/sarabun/800ExtraBold/Sarabun_800ExtraBold.ttf"); }

  :root {
    --ink: #1f1b2e; --muted: #6c6782; --mint: #3fae8c; --mint-2: #6fd3b2; --violet: #7b6ee6; --coral: #ef7f5e;
    --sun: #f2b33d; --bg: #f7f5fc; --glass: rgb(255 255 255 / 0.86);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Sarabun", "Leelawadee UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  /* Background shared by all scenes */
  .bg { position: absolute; inset: 0; background: radial-gradient(60% 70% at 15% 20%, #e3f6ef 0%, transparent 60%), radial-gradient(55% 60% at 88% 85%, #ece7fd 0%, transparent 60%), linear-gradient(160deg, #fbfaff, #f3f0fb); }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
  .blob.a { width: 620px; height: 620px; background: #c8efe1; }
  .blob.b { width: 560px; height: 560px; background: #ddd5fb; }
  .blob.c { width: 420px; height: 420px; background: #ffe3cf; }
  .dots { position: absolute; width: 711px; height: 711px; background: #b9aef0; opacity: 0.35;
    -webkit-mask: url("assets/dots.png") center / contain no-repeat; mask: url("assets/dots.png") center / contain no-repeat; }

  .scene { position: absolute; inset: 0; will-change: opacity, transform; }

  /* Shot scenes */
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; border-radius: 30px; overflow: visible; }
  .shot-img { position: absolute; inset: 0; width: 1920px; height: 1080px; border-radius: 30px; box-shadow: 0 40px 120px -30px rgb(40 30 90 / 0.45), 0 0 0 1px rgb(255 255 255 / 0.6); }
  .hl { position: absolute; border-radius: 22px; border: 4px solid var(--mint); box-shadow: 0 0 0 4000px rgb(24 18 48 / 0.34), 0 0 36px 6px rgb(63 174 140 / 0.55), inset 0 0 0 2px rgb(255 255 255 / 0.7); pointer-events: none; }
  .hl-label { position: absolute; left: 0; bottom: 100%; margin-bottom: 14px; padding: 0.42em 0.95em; border-radius: 999px; white-space: nowrap; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #2f9a78, #5a4fd0); box-shadow: 0 10px 24px -8px rgb(40 30 90 / 0.5); transform-origin: left bottom; }
  .hl-label::after { content: ""; position: absolute; left: 28px; top: 100%; border: 9px solid transparent; border-top-color: #4b62b4; }
  .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 44px; transform-origin: 0 0; filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.35)); }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 4px solid var(--mint); }

  /* Captions (screen space) */
  .caption { position: absolute; left: 64px; bottom: 64px; max-width: 820px; padding: 26px 34px 28px; border-radius: 30px; background: var(--glass);
    backdrop-filter: blur(18px); box-shadow: 0 30px 70px -30px rgb(40 30 90 / 0.5), inset 0 1px 0 #fff; border: 1.5px solid rgb(255 255 255 / 0.9); }
  .caption.top { top: 64px; bottom: auto; }
  .toast.right { left: auto; right: 80px; transform-origin: 100% 0; }
  .step { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--violet); }
  .step b { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: #fff; letter-spacing: 0; font-size: 17px; background: linear-gradient(135deg, var(--mint), var(--violet)); }
  .caption h2 { font-size: 50px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px; }
  .caption p { margin-top: 8px; font-size: 26px; font-weight: 500; color: var(--muted); line-height: 1.45; }

  .toast { position: absolute; left: 50%; top: 70px; display: flex; align-items: center; gap: 18px; padding: 20px 30px 20px 20px; border-radius: 28px; background: #fff;
    box-shadow: 0 30px 70px -24px rgb(40 30 90 / 0.5); border: 2px solid #e8f6ef; transform-origin: 50% 0; }
  .toast i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; font-style: normal; font-size: 34px; color: #fff; background: linear-gradient(135deg, var(--mint-2), var(--mint)); box-shadow: 0 6px 0 #2a8a6c; }
  .toast strong { display: block; font-size: 32px; font-weight: 800; }
  .toast span { font-size: 21px; color: var(--muted); }

  /* Problem scene */
  .p-lines { position: absolute; left: 160px; top: 300px; }
  .p-lines div { font-size: 96px; font-weight: 800; line-height: 1.22; letter-spacing: -1.5px; }
  .p-lines .accent { background: linear-gradient(90deg, var(--coral), #d9475a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .note { position: absolute; width: 270px; padding: 26px 24px 30px; border-radius: 10px 10px 24px 10px; font-size: 27px; font-weight: 700; line-height: 1.3;
    box-shadow: 0 24px 40px -18px rgb(60 40 20 / 0.45); }
  .note::before { content: ""; position: absolute; top: -12px; left: 50%; width: 70px; height: 24px; margin-left: -35px; background: rgb(255 255 255 / 0.6); border-radius: 4px; transform: rotate(-3deg); }
  .qmark { position: absolute; right: 230px; top: 330px; font-size: 300px; font-weight: 800; color: #d9475a; }

  /* Brand + outro */
  .logo { position: absolute; width: 190px; height: 190px; border-radius: 54px; background: linear-gradient(140deg, #6fd3b2 0%, #36a185 100%);
    box-shadow: 0 30px 70px -20px rgb(47 157 125 / 0.65), inset 0 -8px 0 rgb(0 0 0 / 0.08); display: grid; place-items: center; }
  .logo svg { width: 120px; height: 120px; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid rgb(63 174 140 / 0.35); }
  .center-title { position: absolute; left: 0; right: 0; text-align: center; }
  .brand-title { font-size: 112px; font-weight: 800; letter-spacing: -2px; }
  .brand-title span { background: linear-gradient(90deg, #2f9a78, #5a4fd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-sub { font-size: 40px; font-weight: 500; color: var(--muted); }
  .chips { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
  .chip { padding: 18px 30px; border-radius: 999px; font-size: 30px; font-weight: 700; background: #fff; border: 2px solid #ece8f6; box-shadow: 0 6px 0 #e2dcf0; }
  .chip b { color: var(--mint); margin-right: 10px; }
  .foot { font-size: 22px; color: #9a95ad; }

  /* Devices */
  .phone { position: absolute; width: 380px; height: 790px; border-radius: 64px; background: #16141f; padding: 16px; box-shadow: 0 50px 100px -30px rgb(30 20 60 / 0.55); }
  .phone img { width: 100%; height: 100%; border-radius: 50px; object-fit: cover; }
  .phone::before { content: ""; position: absolute; top: 28px; left: 50%; width: 110px; height: 30px; margin-left: -55px; border-radius: 20px; background: #16141f; z-index: 1; }
  .laptop { position: absolute; width: 1060px; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 50px 100px -30px rgb(30 20 60 / 0.5); border: 10px solid #fff; }
  .laptop img { width: 100%; display: block; border-radius: 16px; }
  .d-title { position: absolute; left: 0; right: 0; top: 56px; text-align: center; }
  .d-title h2 { font-size: 70px; font-weight: 800; letter-spacing: -1px; }
  .d-title p { font-size: 30px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div id="frame"></div>
<script src="storyboard.js"></script>
<script src="composition.js"></script>
</body>
</html>
